version: v1.0
name: Publish calico/signing-tools images
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

execution_time_limit:
  minutes: 30

global_job_config:
  env_vars:
    - name: DEV_REGISTRIES
      value: calico
  secrets:
    - name: docker
    - name: projectcalico-toolchain-s3-secrets
  prologue:
    commands:
      - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
      - checkout
      - export BRANCH_NAME=${SEMAPHORE_GIT_TAG_NAME#signing-tools-}

blocks:
  - name: Publish calico/signing-tools amd64 images
    dependencies: []
    run:
      when: "tag =~ '^signing-tools-v'"
    task:
      jobs:
        - name: Linux amd64
          commands:
            - if [ -z "${SEMAPHORE_GIT_PR_NUMBER}" ]; then make -C images calico-signing-tools-cd CONFIRM=true; fi
