version: v1.0
name: Publish calico/scratch-utils images
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

execution_time_limit:
  minutes: 30

global_job_config:
  env_vars:
    - name: DEV_REGISTRIES
      value: calico
  secrets:
    - name: docker
  prologue:
    commands:
      - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
      - checkout
      - |
        if [ "${SEMAPHORE_GIT_REF_TYPE}" = "tag" ]; then
          export BRANCH_NAME=${SEMAPHORE_GIT_TAG_NAME#scratch-utils-}
        else
          export BRANCH_NAME=${SEMAPHORE_GIT_WORKING_BRANCH}
        fi

blocks:
  - name: Publish calico/scratch-utils amd64 images
    dependencies: []
    run:
      when: "branch = 'master' OR tag =~ '^scratch-utils-v'"
    task:
      jobs:
        - name: Linux amd64
          commands:
            - if [ -z "${SEMAPHORE_GIT_PR_NUMBER}" ]; then make -C images calico-scratch-utils-cd CONFIRM=true; fi
