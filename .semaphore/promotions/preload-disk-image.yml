version: v1.0
name: Build go-build preload disk image
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

execution_time_limit:
  minutes: 30

global_job_config:
  env_vars:
    - name: PROJECT
      value: tigera-cc-dev
    - name: ZONE
      value: us-central1-a
    - name: GCS_PATH
      value: gs://gke-argo-disk-images-cc-dev
    # No gcloud command here may prompt: a job has no one to answer it and just
    # hangs until the execution_time_limit.
    - name: CLOUDSDK_CORE_DISABLE_PROMPTS
      value: "1"
  secrets:
    - name: google-service-account-for-gce
  prologue:
    commands:
      - export GOOGLE_APPLICATION_CREDENTIALS=$HOME/secrets/secret.google-service-account-key.json
      - gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
      # The vendored builder is its own module; pick a Go at or above its directive.
      - sem-version go 1.24
      - checkout
      # build-preload-disk.sh resolves the go-build tag from versions.yaml with yq.
      - which yq || (sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq)

blocks:
  - name: Build preload disk image
    dependencies: []
    run:
      when: "branch = 'master' OR tag =~ '^1\\.\\d+\\.\\d+-llvm\\d+(\\.\\d+){2}-k8s1\\.\\d+\\.\\d+'"
    task:
      jobs:
        - name: build-preload-disk
          commands:
            - bash preload-disks/ci-cache/build-preload-disk.sh
