# !! WARNING, DO NOT EDIT !! This file is generated from the fragments
# in /.semaphore/semaphore.yml.d. To update, modify the relevant
# fragment and then run 'make gen-semaphore-yaml'.
version: v1.0
name: go-build
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
auto_cancel:
  running:
    when: "branch != 'master'"
  queued:
    when: "branch != 'master'"

# A publish job builds, tests and pushes in one go, where the build and the
# push used to have a 60-minute budget each in separate pipelines. The
# ppc64le and s390x builds run under QEMU emulation and are the long pole.
execution_time_limit:
  minutes: 120

# Each image has two blocks: one for pull requests that builds and tests, and
# one for master and release branches that builds, tests and publishes in a
# single job. Exactly one of the pair runs per event, so an image is built once
# per commit instead of once per pipeline, and the push happens on the machine
# that already holds the image.
#
# Only the publish blocks carry the `docker` push secret. Semaphore evaluates
# `run: when:` before scheduling a block, so that secret is never injected into
# a pull request run, forked or otherwise.
#
# Git tags do not build. A push to a release branch publishes both the branch
# tag and the release tag that create-tag-on-version-change.yml just created,
# so the tag pipeline has nothing left to do and every block below skips it.
global_job_config:
  secrets:
    - name: docker-hub
  prologue:
    commands:
      - echo $DOCKERHUB_PASSWORD | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - checkout
      # Semaphore is doing shallow clone on a commit without tags.
      # unshallow it for GIT_VERSION:=$(shell git describe --tags --dirty --always) @ Makefile.common
      - git fetch --unshallow
      - touch ~/publish.env
# Block fragments live in semaphore.yml.d/blocks and are appended here in
# filename order. The numeric prefix groups blocks by what the image is, which
# is durable, rather than by how it currently publishes, which is not:
#
#   00  repository checks - builds nothing, and every image block waits on it
#   10  compiler toolchains, the images this repo exists to produce
#   20  runtime base, shipped inside Calico components
#   30  multi-arch CI helper
#
# The numbers are not build order. No toolchain image is built FROM another;
# all five build in parallel once Checks has passed.
blocks:
  # Repository checks
  #
  # Every image block depends on this one, so a failure here stops the builds
  # before any QEMU-emulated build starts or anything is published. The block is
  # change-gated and often skips; Semaphore counts a skipped dependency as
  # passed, and this block produces no artifacts, so skipping it is safe.
  - name: Checks
    dependencies: []
    run:
      when: "change_in(['/.semaphore/', '/hack/', '/Makefile'], {pipeline_file: 'track'})"
    task:
      jobs:
        - name: Check generated semaphore.yml
          commands:
            - make check-semaphore-yaml
        - name: Shellcheck
          commands:
            - command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
            - shellcheck hack/*.sh
  # calico/go-build
  - name: calico/go-build image
    dependencies:
      - Checks
    run:
      when: "pull_request =~ '.*' and change_in(['/images/calico-go-build/', '/cmd/', '/go.mod', '/go.sum', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      env_vars:
        # The branch to test the current go-build against
        - name: CALICO_BRANCH
          value: master
      prologue:
        commands:
          - export CALICO_GO_BUILD_IMAGETAG=${SEMAPHORE_GIT_WORKING_BRANCH}
      jobs:
        - name: Build and test calico/go-build image
          commands:
            - make -C images calico-go-build-image ARCH=$ARCH
            - git clone -b "${CALICO_BRANCH}" --depth 1 git@github.com:projectcalico/calico.git calico
            - cd calico
            - sed -i 's/^GO_BUILD_VER=.*$/GO_BUILD_VER=${CALICO_GO_BUILD_IMAGETAG}/' metadata.mk
            - if [ "${ARCH}" == "amd64" ]; then cd felix && make ut; fi
          matrix:
            - env_var: ARCH
              values: ["amd64", "arm64", "ppc64le", "s390x"]

  - name: calico/go-build image and publish
    dependencies:
      - Checks
    run:
      when: "pull_request !~ '.*' and (branch = 'master' or branch =~ '^go1\\.') and change_in(['/images/calico-go-build/', '/cmd/', '/go.mod', '/go.sum', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      secrets:
        - name: docker
      env_vars:
        - name: DEV_REGISTRIES
          value: calico
        - name: CALICO_BRANCH
          value: master
      prologue:
        commands:
          - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
          - export CALICO_GO_BUILD_IMAGETAG=${SEMAPHORE_GIT_WORKING_BRANCH}
      jobs:
        - name: Build, test and publish calico/go-build image
          commands:
            - make -C images calico-go-build-image ARCH=$ARCH
            - git clone -b "${CALICO_BRANCH}" --depth 1 git@github.com:projectcalico/calico.git calico
            - sed -i 's/^GO_BUILD_VER=.*$/GO_BUILD_VER=${CALICO_GO_BUILD_IMAGETAG}/' calico/metadata.mk
            - if [ "${ARCH}" == "amd64" ]; then ( cd calico/felix && make ut ); fi
            # The release tag is created by create-tag-on-version-change.yml
            # within a minute of the push; this job reaches here ~20 minutes
            # later. Fetch now rather than in the prologue so the tag is visible.
            - git fetch --tags --force
            - |
              export RELEASE_TAG=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-llvm' | sort -V | tail -1)
              if [ -z "${RELEASE_TAG}" ] && [ "${SEMAPHORE_GIT_WORKING_BRANCH}" != "master" ]; then
                echo >&2 "FAIL: no release tag points at HEAD on ${SEMAPHORE_GIT_WORKING_BRANCH}."
                echo >&2 "      create-tag-on-version-change.yml should have created one."
                exit 1
              fi
              echo "RELEASE_TAG=${RELEASE_TAG}" >> ~/publish.env
            # Publish only after the tests above have passed.
            - make -C images calico-go-build-push VALIDARCHES=$ARCH ARCH=$ARCH BRANCH_NAME=${SEMAPHORE_GIT_WORKING_BRANCH} CONFIRM=true
            - |
              . ~/publish.env
              if [ -n "${RELEASE_TAG}" ]; then
                make -C images calico-go-build-push VALIDARCHES=$ARCH ARCH=$ARCH BRANCH_NAME=${RELEASE_TAG} CONFIRM=true
              fi
          matrix:
            - env_var: ARCH
              values: ["amd64", "arm64", "ppc64le", "s390x"]

  - name: calico/go-build manifests
    dependencies:
      - calico/go-build image and publish
    run:
      when: "pull_request !~ '.*' and (branch = 'master' or branch =~ '^go1\\.') and change_in(['/images/calico-go-build/', '/cmd/', '/go.mod', '/go.sum', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      secrets:
        - name: docker
        - name: semaphore-api
      env_vars:
        - name: DEV_REGISTRIES
          value: calico
      prologue:
        commands:
          - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
      jobs:
        - name: Push calico/go-build multi-arch manifests
          commands:
            - git fetch --tags --force
            - make -C images push-calico-go-build-manifests BRANCH_NAME=${SEMAPHORE_GIT_WORKING_BRANCH} CONFIRM=true
            - |
              RELEASE_TAG=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-llvm' | sort -V | tail -1)
              if [ -n "${RELEASE_TAG}" ]; then
                make -C images push-calico-go-build-manifests BRANCH_NAME=${RELEASE_TAG} CONFIRM=true
                # Tell downstream repos to pin the tag we just published.
                make update-go-build-pins CONFIRM=true
              fi
  # calico/rust-build
  - name: calico/rust-build image
    dependencies:
      - Checks
    run:
      when: "pull_request =~ '.*' and change_in(['/images/calico-rust-build/', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      prologue:
        commands:
          - export CALICO_RUST_BUILD_IMAGETAG=${SEMAPHORE_GIT_WORKING_BRANCH}
      jobs:
        - name: Build calico/rust-build image
          commands:
            - make -C images calico-rust-build-image ARCH=$ARCH
          matrix:
            - env_var: ARCH
              values: ["amd64", "arm64", "ppc64le", "s390x"]

  - name: calico/rust-build image and publish
    dependencies:
      - Checks
    run:
      when: "pull_request !~ '.*' and (branch = 'master' or branch =~ '^go1\\.') and change_in(['/images/calico-rust-build/', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      secrets:
        - name: docker
      env_vars:
        - name: DEV_REGISTRIES
          value: calico
      prologue:
        commands:
          - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
          - export CALICO_RUST_BUILD_IMAGETAG=${SEMAPHORE_GIT_WORKING_BRANCH}
          # rust-build is versioned by its own toolchain version, not by the branch.
          - export RUST_VERSION=$(yq -r '.rust.version' images/calico-rust-build/versions.yaml)
      jobs:
        - name: Build and publish calico/rust-build image
          commands:
            - make -C images calico-rust-build-image ARCH=$ARCH
            - make -C images calico-rust-build-push VALIDARCHES=$ARCH ARCH=$ARCH BRANCH_NAME=${RUST_VERSION} CONFIRM=true
          matrix:
