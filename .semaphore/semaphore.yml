    task:
      secrets:
        - name: docker
      env_vars:
        - name: DEV_REGISTRIES
          value: calico
        # Every architecture and both UBI versions must share one tag, so base
        # builds and publishes in a single job rather than a per-arch matrix.
        - name: BRANCH_NAME
          value: ${SEMAPHORE_JOB_CREATION_TIME}
      prologue:
        commands:
          - echo $DOCKER_TOKEN | docker login --username "$DOCKER_USER" --password-stdin
      jobs:
        - name: Build and publish calico/base multi-arch images
          commands:
            - make -C images calico-base-image-all
            - make -C images calico-base-push CONFIRM=true
  # calico/binfmt
  - name: calico/binfmt image
    dependencies:
      - Checks
    run:
      when: "pull_request =~ '.*' and change_in(['/images/calico-binfmt/', '/cmd/', '/go.mod', '/go.sum', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
      jobs:
        - name: Build calico/binfmt amd64 image
          commands:
            - make -C images calico-binfmt-image ARCH=amd64

  - name: calico/binfmt image and publish
    dependencies:
      - Checks
    run:
      when: "pull_request !~ '.*' and (branch = 'master' or branch =~ '^go1\\.') and change_in(['/images/calico-binfmt/', '/cmd/', '/go.mod', '/go.sum', '/images/Makefile', '/lib.Makefile', '/Makefile.common'])"
    task:
